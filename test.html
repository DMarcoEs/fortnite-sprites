<!DOCTYPE html><html><head><meta charset="utf-8"><title>test</title></head><body>
<pre id="out">corriendo…</pre>
<script type="module">
import { loadCatalog } from './js/catalog.js?v=4';
import * as store from './js/store.js?v=4';
import { OWNED, MASTERED, NONE } from './js/store.js?v=4';
import { encodeCollection, decodeCollection, buildShareUrl } from './js/share.js?v=4';
import { computeStats, filterEntries, groupEntries, defaultFilters } from './js/filters.js?v=4';

const log = [];
let pass = 0, fail = 0;
const out = document.getElementById('out');
const flush = () => { out.textContent = log.join('\n'); };
const check = (name, cond, extra = '') => {
  (cond ? pass++ : fail++);
  log.push(`${cond ? 'PASS ' : 'FALLO'}  ${name}${extra ? '  ->  ' + extra : ''}`);
  flush();
};
const section = t => { log.push('', `--- ${t} ---`); flush(); };
window.addEventListener('error', e => { log.push('ERROR GLOBAL: ' + e.message); flush(); });
window.addEventListener('unhandledrejection', e => { log.push('PROMESA RECHAZADA: ' + e.reason?.message); flush(); });

const b64url = b => btoa(String.fromCharCode(...b)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const file = (obj, name = 'b.json') =>
  new File([typeof obj === 'string' ? obj : JSON.stringify(obj)], name, { type: 'application/json' });

// SEGURO: la suite pisa el estado guardado mientras corre. Se respalda antes y se
// devuelve al terminar (y tambien si cierras la pestana a media prueba), para que
// abrir esta pagina nunca te borre la coleccion de verdad.
const KEY = 'fnsprites.v1';
const BACKUP = localStorage.getItem(KEY);
const restore = () => {
  if (BACKUP === null) localStorage.removeItem(KEY); else localStorage.setItem(KEY, BACKUP);
};
window.addEventListener('beforeunload', restore);

try {
  const cat = await loadCatalog();
  localStorage.removeItem(KEY);
  store.loadState();
  const validKeys = new Set(cat.byKey.keys());

  section('catalogo');
  check('25 sprites', cat.sprites.length === 25, cat.sprites.length);
  check('117 entradas vivas', cat.totalAll === 117, cat.totalAll);
  check('117 lanzadas (ninguna pendiente)', cat.totalReleased === 117, cat.totalReleased);
  check('catalogVersion = 3', cat.catalogVersion === 3, cat.catalogVersion);
  check('22 posiciones reservadas', cat.retired.size === 22, cat.retired.size);

  section('las variantes retiradas ya no existen');
  const retiradas = ['fire:gem','ghost:gem','dream:gem','punk:gem','boss:gem','boss:holofoil',
                     'air:gem','seven:gem','batman:gem','fishy:gem','fishy:holofoil','striker:gem',
                     'aura:holofoil','lootin-llama:holofoil','lootin-llama:cube',
                     'peeky-peely:gem','peeky-peely:cube'];
  check('ninguna variante retirada aparece en el catalogo',
        retiradas.every(k => !cat.byKey.has(k)));
  check('los 5 sprites de Override ya no estan',
        ['xray','pond','honey','dumpster','bullet'].every(id => !cat.byKey.has(`${id}:base`)));
  check('todas siguen en retired[]', retiradas.every(k => cat.retired.has(k)));
  check('las que si existen siguen ahi',
        ['water:gem','earth:cube','zero-point:quack','grim:gem','batman:cube','duck:gem']
          .every(k => cat.byKey.has(k)));

  section('codeOrder y posiciones reservadas');
  check('codeIndex conserva las 139 posiciones', cat.codeIndex.length === 139, cat.codeIndex.length);
  check('117 posiciones vivas', cat.codeIndex.filter(Boolean).length === 117);
  check('22 huecos reservados', cat.codeIndex.filter(e => e === null).length === 22);
  const setCode = new Set(cat.codeIndex.filter(Boolean).map(e => e.key));
  check('mismo conjunto de claves vivas en ambos ordenes',
        setCode.size === cat.flat.length && cat.flat.every(e => setCode.has(e.key)));
  // punk:gem se retiro y dejo un hueco a media lista, asi que todo lo que va
  // despues ocupa distinta posicion en cada orden. Ese desfase es justo lo que
  // evita que los codigos viejos se corrompan.
  const desfase = cat.flat.filter(e =>
    cat.flat.indexOf(e) !== cat.codeIndex.findIndex(x => x?.key === e.key));
  check('el orden de presentacion difiere del de codificacion',
        desfase.length > 0, `${desfase.length} entradas desfasadas`);

  section('coleccion de prueba');
  const marked = [
    ['water:base', MASTERED], ['water:gold', OWNED], ['zero-point:quack', MASTERED],
    ['john-wick:base', OWNED], ['grim:cube', OWNED], ['punk:cube', MASTERED],
    ['air:holofoil', OWNED], ['boss:base', MASTERED], ['batman:cube', OWNED],
    ['peeky-peely:holofoil', MASTERED],
  ];
  for (const [k, s] of marked) store.setStatus(k, s);

  check('estado inicial NONE -> ciclo 1/2/3', (() => {
    const k = 'demon:gold';
    return store.cycleStatus(k) === OWNED && store.cycleStatus(k) === MASTERED && store.cycleStatus(k) === NONE;
  })());
  check('fecha automatica al obtener', /^\d{4}-\d{2}-\d{2}$/.test(store.getEntry('water:base').date),
        store.getEntry('water:base').date);

  const stats = computeStats(cat, store.getStatus);
  check('stats: 10 obtenidas de 117', stats.collection.owned === 10 && stats.collection.total === 117,
        `${stats.collection.owned}/${stats.collection.total}`);
  check('stats: 5 masterizadas', stats.collection.mastered === 5, stats.collection.mastered);
  check('stats: mastery de sprites = 2', stats.masteredSprites === 2, stats.masteredSprites);
  check('stats: los desgloses suman 117',
        [...stats.byVariant.values()].reduce((a, b) => a + b.total, 0) === 117);

  section('codigo para compartir');
  const code = encodeCollection(cat, store.getStatus);
  check('codigo mide 49 caracteres', code.length === 49, `${code.length}: ${code}`);
  check('lleva el prefijo de version 3', code.startsWith('3.'));
  const { statuses } = decodeCollection(cat, code);
  check('round-trip exacto en las 117 entradas vivas',
        cat.flat.every(e => statuses.get(e.key) === store.getStatus(e.key)));
  check('no inventa estados para las retiradas',
        retiradas.every(k => !statuses.has(k)));
  check('acepta el link completo pegado',
        decodeCollection(cat, buildShareUrl(code)).statuses.get('water:base') === MASTERED);

  section('compatibilidad hacia atras (lo que justifica codeOrder)');
  // Codigo "de la epoca v1", cuando el catalogo tenia 118 entradas y ni fire:gem
  // ni los sprites de Override existian. Las posiciones se conservan intactas.
  const OLD_N = 118;
  const oldBytes = new Uint8Array(Math.ceil(OLD_N * 2 / 8));
  cat.codeIndex.slice(0, OLD_N).forEach((e, i) => {
    if (!e) return;
    const bit = i * 2;
    oldBytes[bit >> 3] |= store.getStatus(e.key) << (bit & 7);
  });
  const oldCode = `1.${b64url(oldBytes)}`;
  check('el codigo viejo es mas corto', oldCode.length < code.length, `${oldCode.length} vs ${code.length}`);
  const oldDec = decodeCollection(cat, oldCode);
  check('un codigo viejo decodifica IDENTICO las entradas que ya existian',
        cat.codeIndex.slice(0, OLD_N).filter(Boolean)
          .every(e => oldDec.statuses.get(e.key) === store.getStatus(e.key)));
  check('las entradas posteriores salen como "no la tengo"',
        cat.codeIndex.slice(OLD_N).filter(Boolean).every(e => oldDec.statuses.get(e.key) === NONE));
  check('retirar 22 entradas NO corrio las posiciones siguientes',
        oldDec.statuses.get('batman:cube') === OWNED && oldDec.statuses.get('john-wick:base') === OWNED);

  section('codigos invalidos');
  for (const bad of ['basura', '3.@@@@', '', 'AbC123', '3.' + 'A'.repeat(500)]) {
    let threw = false;
    try { decodeCollection(cat, bad); } catch { threw = true; }
    check(`"${bad.slice(0, 14)}${bad.length > 14 ? '…' : ''}" lanza error legible`, threw);
  }

  section('comparacion');
  const friend = new Map(cat.flat.map(e => [e.key, NONE]));
  friend.set('water:base', OWNED); friend.set('earth:base', OWNED); friend.set('fire:base', MASTERED);
  const b = { mine: 0, theirs: 0, both: 0, none: 0 };
  for (const e of cat.flat) {
    if (!e.released) continue;
    const m = store.getStatus(e.key) >= OWNED, t = (friend.get(e.key) ?? 0) >= OWNED;
    b[m && t ? 'both' : m ? 'mine' : t ? 'theirs' : 'none']++;
  }
  check('1 en "ambos"', b.both === 1, b.both);
  check('9 solo mios', b.mine === 9, b.mine);
  check('2 solo suyos', b.theirs === 2, b.theirs);
  check('los 4 grupos suman 117', b.mine + b.theirs + b.both + b.none === 117);

  section('filtros');
  const f = defaultFilters();
  const ctx = { getStatus: store.getStatus, isHunted: store.isHunted };
  f.search = 'grim';
  check('buscar "grim" deja solo Grim Reaper',
        new Set(filterEntries(cat, f, ctx).map(e => e.spriteId)).size === 1);
  f.search = ''; f.rarity = 'mythic';
  check('filtro Mythic da 26', filterEntries(cat, f, ctx).length === 26, filterEntries(cat, f, ctx).length);
  f.rarity = 'all'; f.status = 'owned';
  check('filtro "ya los tengo" da 10', filterEntries(cat, f, ctx).length === 10, filterEntries(cat, f, ctx).length);
  f.status = 'all'; f.variant = 'gem';
  check('filtro variante Gem da 8', filterEntries(cat, f, ctx).length === 8, filterEntries(cat, f, ctx).length);
  f.variant = 'all'; f.groupBy = 'rarity';
  check('agrupar por rareza da 4 grupos', groupEntries(cat, filterEntries(cat, f, ctx), f).length === 4);
  f.groupBy = 'variant';
  check('agrupar por variante da 8 grupos', groupEntries(cat, filterEntries(cat, f, ctx), f).length === 8);
  f.groupBy = 'sprite';
  check('agrupar por sprite da 25 grupos', groupEntries(cat, filterEntries(cat, f, ctx), f).length === 25);

  section('hunt list');
  store.toggleHunt('demon:gem');
  check('se agrega', store.isHunted('demon:gem'));
  store.setStatus('demon:gem', OWNED);
  check('obtenerlo lo saca de la lista', !store.isHunted('demon:gem'));

  section('respaldo e import saneado');
  const expected = encodeCollection(cat, store.getStatus);
  const snapshot = JSON.stringify(store.loadState());
  store.resetAll();
  check('reset deja la coleccion en 0', computeStats(cat, store.getStatus).collection.owned === 0);
  const r1 = await store.importJSON(file(snapshot), validKeys);
  check('importar restaura 11 entradas', r1.importadas === 11, JSON.stringify(r1));
  check('importar reproduce el codigo identico', encodeCollection(cat, store.getStatus) === expected);

  const r2 = await store.importJSON(file({ entries: {
    'water:base': { status: 1 },
    'sprite:inventado': { status: 1 },
    'fire:gem': { status: 1 },
    'water:gold': { status: 99 },
    'water:gummy': { status: -1 },
    'fire:base': 'no soy un objeto',
    'earth:base': { status: 2, date: 'no-es-fecha', note: 'x'.repeat(9000) },
  } }), validKeys);
  check('descarta claves inventadas, retiradas y estados invalidos',
        r2.importadas === 2 && r2.descartadas === 5, JSON.stringify(r2));
  check('sanea una fecha invalida', store.getEntry('earth:base').date === '');
  check('recorta notas larguisimas', store.getEntry('earth:base').note.length === 500);

  for (const [nombre, bad] of [
    ['JSON roto', file('{no soy json')],
    ['sin entries', file({ hola: 1 })],
    ['entries nulo', file({ entries: null })],
  ]) {
    let threw = false;
    try { await store.importJSON(bad, validKeys); } catch { threw = true; }
    check(`rechaza ${nombre}`, threw);
  }
  let tooBig = false;
  try {
    await store.importJSON(new File(['x'.repeat(1024 * 1024 + 10)], 'big.json'), validKeys);
  } catch { tooBig = true; }
  check('rechaza archivos de mas de 1 MB', tooBig);

  section('imagenes');
  check('toda entrada tiene ruta de imagen',
        cat.flat.every(e => e.img === `img/sprites/${e.spriteId}-${e.variantId}.png`));
  const exists = n => fetch(`img/sprites/${n}.png`).then(r => r.ok).catch(() => false);
  // Por lotes: 117 peticiones a la vez hacen que un CDN estrangule parte de ellas
  // y den falsos 404. De 8 en 8 el resultado es estable.
  let totalImgs = 0;
  for (let i = 0; i < cat.flat.length; i += 8) {
    const lote = cat.flat.slice(i, i + 8);
    const res = await Promise.all(lote.map(e => exists(`${e.spriteId}-${e.variantId}`)));
    totalImgs += res.filter(Boolean).length;
  }
  check('las 117 entradas tienen imagen', totalImgs === 117, totalImgs);
  const borradas = await Promise.all(['fire-gem', 'bullet-base', 'batman-gem'].map(exists));
  check('las imagenes de entradas retiradas se borraron', borradas.every(x => x === false), borradas.join(', '));

  section('sin emojis en la interfaz');
  const rxEmoji = /[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}\u{2B00}-\u{2BFF}]/u;
  const htmls = await Promise.all(['index.html', 'compare.html'].map(p => fetch(p).then(r => r.text())));
  check('index.html y compare.html no tienen emojis', htmls.every(h => !rxEmoji.test(h)));
  const jss = await Promise.all(['render', 'compare', 'app', 'store', 'share', 'filters', 'catalog']
    .map(m => fetch(`js/${m}.js`).then(r => r.text())));
  check('ningun modulo JS tiene emojis', jss.every(s => !rxEmoji.test(s)));

} catch (err) {
  fail++;
  log.push('EXCEPCION: ' + err.message + '\n' + err.stack);
} finally {
  restore();
}

log.push('', `===== ${pass} pasaron, ${fail} fallaron =====`,
  BACKUP === null ? 'No habia coleccion guardada; nada que restaurar.'
                  : 'Tu coleccion real quedo intacta (respaldada y restaurada).');
flush();
</script>
</body></html>
